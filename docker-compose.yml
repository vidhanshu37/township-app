services:
  db:
    image: postgres:16-alpine
    container_name: township-db
    environment:
      POSTGRES_DB: township
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - township_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d township" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  township_pgdata:
