spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: township-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  web:
    error:
      include-message: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 60
  cors:
    allowed-origins: http://localhost:5173
  demo-mode: ${APP_DEMO_MODE:false}
  billing:
    rate-per-sqft: 6.50
    due-day: 10
    late-fee-rate: 0.18
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}

server:
  port: 8085

